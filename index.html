<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hôm nay làm gì? 🎮🍿</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 500px;
            min-height: 450px;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 18px;
        }

        .choices {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 18px 25px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .roblox {
            background-color: #ff4757;
            color: white;
        }

        .movie {
            background-color: #3742fa;
            color: white;
        }

        .yes {
            background-color: #ff4d88;
            color: white;
        }

        .no {
            background-color: #777;
            color: white;
        }

        #result {
            margin-top: 30px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }

        #loveQuestion {
            display: none;
            margin-top: 20px;
        }

        /* Vùng chứa hai nút */
        #buttonArea {
            position: relative;
            height: 220px;
            width: 100%;
        }

        /* Ban đầu hai nút nằm cạnh nhau */
        #yesButton,
        #noButton {
            position: absolute;
            top: 20px;
        }

        #yesButton {
            left: 25%;
            transform: translateX(-50%);
        }

        #noButton {
            left: 75%;
            transform: translateX(-50%);
        }

        #finalMessage {
            display: none;
            margin-top: 30px;
            font-size: 24px;
            font-weight: bold;
            color: #ff4d88;
            line-height: 1.5;
        }

        .reset {
            display: none;
            margin-top: 25px;
            background: #eee;
            color: #333;
        }

        @media (max-width: 480px) {
            .container {
                width: 100%;
                padding: 30px 20px;
            }

            button {
                padding: 15px 20px;
                font-size: 16px;
            }

            #yesButton {
                left: 28%;
            }

            #noButton {
                left: 72%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Hôm nay làm gì pé? 🤔</h1>

        <p>Chọn một hoạt động mà pé muốn nhé!</p>

        <!-- Chọn hoạt động -->
        <div class="choices" id="activityChoices">

            <button class="roblox"
                onclick="chooseActivity('🎮 Chơi Roblox')">
                🎮 Chơi Roblox
            </button>

            <button class="movie"
                onclick="chooseActivity('🍿 Xem phim')">
                🍿 Xem phim
            </button>

        </div>

        <!-- Hiển thị hoạt động đã chọn -->
        <div id="result"></div>

        <!-- Câu hỏi yêu -->
        <div id="loveQuestion">

            <p style="font-size: 22px; font-weight: bold;">
                Bé có yêu anh hong? 🥺❤️
            </p>

            <!-- Khu vực hai nút -->
            <div id="buttonArea">

                <button class="yes" id="yesButton"
                    onclick="sayYes()">
                    Có ❤️
                </button>

                <button class="no" id="noButton">
                    Không 😝
                </button>

            </div>

        </div>

        <!-- Tin nhắn cuối -->
        <div id="finalMessage">
            Anh cũng yêu bé lắm hihi 🥰❤️
        </div>

        <button class="reset" id="resetBtn"
            onclick="resetChoice()">
            Chơi lại 🔄
        </button>

    </div>


    <script>

        const noButton = document.getElementById("noButton");
        const buttonArea = document.getElementById("buttonArea");

        let noClickCount = 0;


        // Chọn hoạt động
        function chooseActivity(activity) {

            document.getElementById("result").innerHTML =
                "Bé đã chọn: <br><br>" + activity + " 🎉";

            document.getElementById("activityChoices").style.display =
                "none";

            document.getElementById("loveQuestion").style.display =
                "block";

            // Reset nút Không về vị trí ban đầu
            noClickCount = 0;
            noButton.style.display = "inline-block";
            noButton.style.left = "75%";
            noButton.style.top = "20px";
            noButton.style.transform = "translateX(-50%)";
        }


        // Khi bấm nút Không
        noButton.addEventListener("click", function() {

            noClickCount++;

            // Bấm 5 lần thì biến mất
            if (noClickCount >= 5) {
                noButton.style.display = "none";
                return;
            }

            const areaWidth = buttonArea.clientWidth;
            const areaHeight = buttonArea.clientHeight;

            const buttonWidth = noButton.offsetWidth;
            const buttonHeight = noButton.offsetHeight;

            const padding = 10;

            // Tạo vị trí ngẫu nhiên trong vùng chứa
            const maxX = areaWidth - buttonWidth - padding * 2;
            const maxY = areaHeight - buttonHeight - padding;

            const randomX =
                Math.floor(Math.random() * maxX) + padding;

            // Cho nút nhảy xuống dưới một chút,
            // tránh đè lên nút Có
            const randomY =
                Math.floor(Math.random() * (maxY - 60)) + 70;

            // Nhảy ngay sang vị trí mới
            noButton.style.left = randomX + "px";
            noButton.style.top = randomY + "px";
            noButton.style.transform = "none";
        });


        // Chọn Có
        function sayYes() {

            document.getElementById("loveQuestion").style.display =
                "none";

            document.getElementById("finalMessage").style.display =
                "block";

            document.getElementById("resetBtn").style.display =
                "inline-block";
        }


        // Chơi lại
        function resetChoice() {

            noClickCount = 0;

            document.getElementById("result").innerHTML = "";

            document.getElementById("activityChoices").style.display =
                "flex";

            document.getElementById("loveQuestion").style.display =
                "none";

            document.getElementById("finalMessage").style.display =
                "none";

            document.getElementById("resetBtn").style.display =
                "none";

            // Đưa nút Không về bên phải
            noButton.style.display = "inline-block";
            noButton.style.left = "75%";
            noButton.style.top = "20px";
            noButton.style.transform = "translateX(-50%)";
        }

    </script>

</body>
</html>
